<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.title }} | Project Details</title>
    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .detail-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between">

    <!-- Top Navigation -->
    <nav class="navbar navbar-dark border-bottom border-secondary border-opacity-25 py-3">
        <div class="container" style="max-width: 800px;">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" href="{% url 'project_list' %}">
                <i class="bi bi-arrow-left text-primary"></i>
                <span>Back to Overview</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5" style="max-width: 800px;">
        <div class="card detail-card p-4 p-md-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <span class="badge bg-primary bg-opacity-25 text-info px-3 py-2 border border-info border-opacity-25 rounded-pill">
                    <i class="bi bi-stack me-1"></i> {{ project.technology }}
                </span>
                <span class="text-secondary small">
                    <i class="bi bi-clock-history me-1"></i> Recorded on {{ project.created_at|date:"F d, Y" }}
                </span>
            </div>

            <h1 class="fw-bold text-white mb-4">{{ project.title }}</h1>

            <div class="text-light text-opacity-75 fs-5 leading-relaxed mb-4">
                <p style="white-space: pre-line;">{{ project.description }}</p>
            </div>

            <hr class="border-secondary border-opacity-25 my-4">

            <div class="d-flex flex-wrap gap-3">
                {% if project.github_link %}
                <a href="{{ project.github_link }}" target="_blank" class="btn btn-light px-4 rounded-pill fw-semibold">
                    <i class="bi bi-github me-2"></i> View Repository
                </a>
                {% endif %}
                <a href="{% url 'project_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                    <i class="bi bi-grid me-2"></i> All Projects
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 border-top border-secondary border-opacity-25 text-secondary small">
        <p class="mb-0">Built with Django & SQLite</p>
    </footer>

</body>
</html>
